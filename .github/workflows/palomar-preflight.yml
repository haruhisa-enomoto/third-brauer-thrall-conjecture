name: Palomar preflight

# Runs Palomar's complete mechanical verification for one commit of this
# repository, as required before a submission to https://submit.palomar-registry.org/.
# Start it by hand from the Actions tab with the full commit SHA to check.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character commit to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@14aa8d6b3c2f14a8540605e37144560b9a00e7e7
    with:
      repository: haruhisa-enomoto/third-brauer-thrall-conjecture
      commit: ${{ inputs.commit }}
      pipeline_commit: 14aa8d6b3c2f14a8540605e37144560b9a00e7e7
      request_id: bt3preflight
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path": "comparator.json", "authorization_relationship": "I am a responsible author or maintainer"}'
