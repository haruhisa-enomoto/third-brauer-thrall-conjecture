name = "large_indecomposable"
version = "0.1.0"
defaultTargets = ["LargeIndecomposable"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "c55e6e786f49471c72fbddbec5415808896aec1e"

[[lean_lib]]
name = "LargeIndecomposable"
globs = ["LargeIndecomposable", "LargeIndecomposable.*"]
weakLeanArgs = ["-j1", "-M14000"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]
weakLeanArgs = ["-j1", "-M14000"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
weakLeanArgs = ["-j1", "-M14000"]
