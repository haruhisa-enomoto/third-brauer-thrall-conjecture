    authors: ["Haruhisa Enomoto"]
    type: "paper"
    location: "https://arxiv.org/abs/2611.06325v1"
    relationship: "formalizes"
    note: >-
      The formalized paper, written under the author's direction with
      GPT-6-Astra and revised with Claude Opus 5.5. The library follows
      arXiv:2611.06325v1, the same source as hexagon:2610.00179v2
      (docs/MANUSCRIPT.md). Statements are
      matched with Lean declarations in docs/PAPER-CORRESPONDENCE.md.
    author_endorsement: "participated"
  - title: "Representation embeddings and the second Brauer–Thrall conjecture"
    authors: ["K. Bongartz"]
    type: "paper"
    location: "https://arxiv.org/abs/1611.02017v5"
    relationship: "background"
    note: >-
      Source of Theorem 6, which the paper cites and the library proves. Two steps
      have different proofs here: see docs/proofs.
    author_endorsement: "not-contacted"
  - title: "Rigid families and endomorphism algebras of Kronecker modules"
    authors: ["R. Göbel", "D. Simson"]
    type: "paper"
    location: "Israel J. Math. 110 (1999), 293–315"
    relationship: "background"
    note: >-
      Source of the rigid families used for Corollary 1.1 (Theorem 5.6 of the
      paper). The library proves the rigid families over infinite fields, which
      include all algebraically closed fields.
    author_endorsement: "not-contacted"

