      note: "Proved in Solution.lean from LargeIndecomposable.theoremA."
    - source: "Representation embeddings and the third Brauer–Thrall conjecture, Corollary 1.1"
      lean: "LargeIndecomposable.Challenge.corollaryDimension"
      module: "Challenge"
      status: "proved"
      note: >-
        The dimension part, without the number of modules. Proved in
        Solution.lean from LargeIndecomposable.corollaryDimension.
    - source: "Representation embeddings and the third Brauer–Thrall conjecture, Corollary 5.7"
      lean: "LargeIndecomposable.Challenge.corollaryRadical"
      module: "Challenge"
      status: "proved"
      note: >-
        Without the number of modules and the explicit bound on n. Proved in
        Solution.lean from LargeIndecomposable.corollaryRadical.
    - source: "Representation embeddings and the third Brauer–Thrall conjecture, Corollary 5.7"
      lean: "LargeIndecomposable.Challenge.corollaryCount"
      module: "Challenge"
      status: "proved"
      note: >-
        Without the explicit bound on n. Proved in Solution.lean from
        LargeIndecomposable.corollaryCount.
    - source: "Representation embeddings and the third Brauer–Thrall conjecture, Corollary 1.1 (= Corollary 5.7)"
      lean: "LargeIndecomposable.Challenge.corollaryCountBounded"
      module: "Challenge"
      status: "proved"
      note: >-
        The full corollary, with n ≤ max(30, 4 dim A). Proved in Solution.lean
        from LargeIndecomposable.corollaryCountBounded.

acknowledgements: "Lean and Mathlib."
