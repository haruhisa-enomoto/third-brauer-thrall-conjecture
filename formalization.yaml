version: "v0.4"

project:
  name: "Representation embeddings and the third Brauer–Thrall conjecture"
  description: >-
    A Lean 4 formalization, built on Mathlib, of the principal results of the
    paper Representation embeddings and the third Brauer–Thrall conjecture. Over
    an algebraically closed field, every representation-infinite
    finite-dimensional algebra admits a representation embedding of a
    colimit-closed category of Kronecker modules that preserves infinite
    dimensions (Theorem A). Hence, for every infinite cardinal κ, it has 2^κ
    pairwise non-isomorphic indecomposable modules of dimension κ whose
    endomorphism rings are local with residue field k and whose radicals
    satisfy (rad End M)^n = 0 for one n ≤ max(30, 4 dim A) independent of κ;
    for κ ≥ |k| this is the largest possible number (Corollary 1.1, in full).
    Weaker parts of the corollary are also compared: modules of every infinite
    dimension, the endomorphism control without the count and the bound, and
    the count without the bound. The cited inputs are proved in the library:
    Bongartz's Theorem 6 and Göbel and Simson's rigid families over infinite
    fields.
  authors: ["Haruhisa Enomoto"]
  responsible_maintainers: ["Haruhisa Enomoto"]
  license: "Apache-2.0"

classification:
  arxiv: ["math.RT", "math.RA"]
  msc2020: ["16G20", "16G60", "16G10"]

sources:
