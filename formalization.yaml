status:
  scope: >-
    Theorem A and the full Corollary 1.1 (= Corollary 5.7) as stated in the
    paper, for arbitrary algebraically closed fields: corollaryCountBounded
    gives 2^κ modules with one nilpotence bound n ≤ max(30, 4 dim A), the upper
    count for κ ≥ |k| included. corollaryDimension, corollaryRadical and
    corollaryCount are compared as its weaker parts. The compared statements in
    Challenge.lean use only Mathlib definitions. Every numbered statement of the
    paper used for these results is covered in the form recorded in
    docs/PAPER-CORRESPONDENCE.md, and the cited inputs are proved: Bongartz's
    Theorem 6 and Göbel and Simson's rigid families over infinite fields. The
    library proves only the part of Bongartz's large-line theorem that Theorem A
    needs. Lemma 5.4 of the paper is bypassed: the bound is proved directly.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code"
      tool_setup: >-
        An AI coding agent working in a local Lean project with compiler
        feedback, explicit axiom audits and a statement-by-statement correspondence
        with the paper, under the author's direction. The library reuses earlier
        formalizations listed in VENDORED.md.
      cost:
        wall_time: "About four days of development (October 29 – November 1, 2026)"
        spend_usd: "subscription-based"
        hardware: "Local Linux workstation"
      prompting_notes: >-
        The author required the cited inputs to be proved, with Mathlib as the only
        dependency, and allowed proof routes that differ from the literature.
  spend_usd: "subscription-based"
  notes: >-
    The paper was written with GPT-6-Astra and revised with Claude Opus 5.5 under
    the author's direction. The formalization was written by AI coding agents
    under the author's direction. A complete model-by-model history of the reused
    code has not been reconstructed.

fidelity:
  divergences: >-
    Theorem A and Corollary 1.1 (= Corollary 5.7) are stated as in the paper.
    CorollaryCountBounded is the full corollary: 2^κ pairwise non-isomorphic
    indecomposable modules of every infinite dimension κ, the largest possible
    number when κ ≥ |k|, with End/rad End ≅ k and one nilpotence bound
    n ≤ max(30, 4 dim A). CorollaryDimension, CorollaryRadical and CorollaryCount
    are its weaker parts. The statements have the
    field, the algebra and the modules in one universe. Dimensions are cardinals.
    Intermediate results may be proved in an equivalent or more general form and
    by a different route; docs/PAPER-CORRESPONDENCE.md lists these. Two steps of
    Bongartz's Theorem 6 have different proofs: the critical pair avoids tilting
    theory, and long lines avoid the classification of large sincere algebras. No
    other weakening of the hypotheses or conclusions of these results is known.

review:
  status: "agent-reviewed"
  reviewers: ["OpenAI Codex agent"]
  notes: >-
    A separate agent audited an earlier revision: the complete statement
    definitions against the paper, the final proof assembly, selected load-bearing
    arguments of the two proofs in docs/proofs, the build, the axiom reports and the
    comparator. A later agent audit checked the added statements CorollaryCount and
    CorollaryCountBounded against the paper, the new proofs of the count and the
    bound, the build, the axiom reports and the comparator. Neither was a
    line-by-line review, and no human expert has checked the Lean statements or
    these proofs.

